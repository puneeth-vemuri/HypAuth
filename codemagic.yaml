workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build (For Sideloading)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --warn-only
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS unsigned app
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          zip -r -q HypAuth.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/iphoneos/HypAuth.ipa
