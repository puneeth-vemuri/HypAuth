workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build (For Sideloading)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Generate Flutter engine files
        script: |
          flutter build ios --release --no-codesign || true
      - name: Build with xcodebuild (no signing)
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q HypAuth.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/iphoneos/HypAuth.ipa
