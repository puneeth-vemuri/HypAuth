name: hyp_auth
description: "A production-grade, 100% offline, privacy-first Authenticator application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  flutter_secure_storage: ^9.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  mobile_scanner: ^5.0.0
  local_auth: ^2.1.8
  crypto: ^3.0.3
  logger: ^2.0.2+1
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  screen_protector: ^1.5.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
